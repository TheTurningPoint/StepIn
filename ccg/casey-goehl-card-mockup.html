<style>
  @page { size: 3.5in 2in; margin: 0; }

  }
  .title {

    text-transform:uppercase; text-align:center;
    margin:0.035in 0 0.1in;
  }
  .rule {
    width:0.4in; height:0.6pt; background:rgba(96,119,135,0.4);
    margin:0 0 0.1in;
  }
  .primary-url {
    color:#607787; font-weight:700; font-size:8pt;
    letter-spacing:0.12em; text-transform:uppercase;
    text-align:center; margin:0 0 0.05in;
  }
  .secondary {
    text-align:center; line-height:1.55; font-size:6.2pt;
    letter-spacing:0.05em; text-transform:uppercase;
    color:#7d7566;
  }
  .secondary .accent { color:#c08f3e; }
  .tagline {
    position:absolute; bottom:0.1in; left:0; right:0;
    text-align:center; color:#e2b060; font-style:italic;
    font-size:7pt; letter-spacing:0.14em; text-transform:uppercase;
  }
</style>
