<head>
<meta charset="utf-8">
<title>Casey Goehl — Business Card Mockup v2</title>
<style>
  @page { size: 3.75in 2.25in; margin: 0; }
  html,body { margin:0; padding:0; background:#dcdcdc; }
  .stage { display:flex; justify-content:center; padding:40px; }
  .card {
    width:3.75in; height:2.25in; background:#f7f2e9;
    box-shadow:0 6px 24px rgba(0,0,0,0.2);
    position:relative; overflow:hidden;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    box-sizing:border-box;
  }
  /* .trim = the actual 3.5x2in cut line; 0.125in bleed surrounds it on every side */
  .trim {
    position:absolute; inset:0.125in;
  }
  .frame {
    position:absolute; inset:0.13in;
    border:0.6pt solid rgba(226,176,96,0.55);
  }
  .content {
    position:absolute; inset:0.09in;
    display:flex; flex-direction:column; align-items:center;
    padding-top:0.12in;
  }
  .honeycomb { width:0.44in; }
  .honeycomb img { width:100%; display:block; }
  .name {
    color:#e2b060; font-size:14.5pt; letter-spacing:0.22em;
    text-transform:uppercase; font-weight:700; text-align:center;
    margin:0.08in 0 0;
  }
  .title {
    color:#607787; font-size:6.6pt; letter-spacing:0.34em;
    text-transform:uppercase; text-align:center;
    margin:0.035in 0 0.1in;
  }
  .rule {
    width:0.4in; height:0.6pt; background:rgba(96,119,135,0.4);
    margin:0 0 0.1in;
  }
  .primary-url {
    color:#607787; font-weight:700; font-size:8pt;
    letter-spacing:0.12em; text-transform:uppercase;
    text-align:center; margin:0 0 0.05in;
  }
  .secondary {
    text-align:center; line-height:1.45; font-size:6.2pt;
    letter-spacing:0.05em; text-transform:uppercase;
    color:#7d7566;
  }
  .secondary .accent { color:#c08f3e; }
  .tagline {
    position:absolute; bottom:0.13in; left:0; right:0;
    text-align:center; color:#e2b060; font-style:italic;
    font-size:7pt; letter-spacing:0.14em; text-transform:uppercase;
  }
</style>
</head>
